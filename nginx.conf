# nginx.conf do kit de treinamento de load balancer.
#
# Um único processo do nginx faz três papéis ao mesmo tempo:
#   1. Load balancer na porta 4000 (a "URL única" que o usuário acessa).
#   2. Servidor web do site1 na porta 5001.
#   3. Servidor web do site2 na porta 5002.
#
# ANTES DE SUBIR: troque CAMINHO_DO_REPOSITORIO (aparece duas vezes, nas
# linhas "root") pelo caminho completo da pasta onde você clonou este
# repositório. Use barras normais (/) em todos os sistemas, inclusive no Windows.
#   Windows:  root C:/Users/maria/load-balancer/site1;
#   macOS:    root /Users/maria/load-balancer/site1;
#   Linux:    root /home/maria/load-balancer/site1;
# Se o caminho tiver espaços, coloque entre aspas:
#   root "C:/Meus Projetos/load-balancer/site1";

events {
}

http {
    # Grupo de servidores entre os quais o load balancer distribui as
    # requisições. Sem nenhuma opção extra o algoritmo é o Round-Robin:
    # uma requisição para cada servidor, em sequência, e volta ao primeiro.
    upstream meus_sites {
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;

        # Alternativas usadas nos exercícios do README. Use uma por vez e
        # aplique com "nginx -s reload".
        #
        # least_conn;                        # manda para o servidor com menos conexões ativas
        # ip_hash;                           # o mesmo cliente cai sempre no mesmo servidor
        # server 127.0.0.1:5001 weight=2;    # servidor 1 recebe 2 de cada 3 requisições (substitui a linha do 5001 acima)
        # server 127.0.0.1:5002 down;        # tira o servidor 2 do rodízio, como em uma manutenção (substitui a linha do 5002 acima)
    }

    # O load balancer. Não tem arquivos próprios: só recebe e repassa.
    server {
        listen 4000;

        location / {
            # Entrega a requisição a um dos servidores do grupo meus_sites.
            proxy_pass http://meus_sites;

            # Pede ao navegador para não guardar a página em cache. Assim cada
            # F5 chega de verdade ao load balancer e a alternância fica visível.
            add_header Cache-Control "no-store";
        }
    }

    # Servidor do site1. Aqui o nginx trabalha como servidor web comum:
    # entrega os arquivos que estão na pasta site1.
    server {
        listen 5001;
        server_name localhost;

        root CAMINHO_DO_REPOSITORIO/site1;
        index index.html;

        # Cabeçalho extra na resposta para identificar o servidor pelo terminal,
        # sem precisar abrir o navegador (passo 7 do README).
        add_header X-Servidor "servidor1";
    }

    # Servidor do site2. Igual ao de cima, só muda a porta, a pasta e o cabeçalho.
    server {
        listen 5002;
        server_name localhost;

        root CAMINHO_DO_REPOSITORIO/site2;
        index index.html;

        add_header X-Servidor "servidor2";
    }
}
